[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buwubot"
version = "0.1.0"
description = "Local QQ companion with durable queues and layered memory"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "websockets>=14,<17",
  "pydantic>=2.10,<3",
  "mem0ai>=1.0,<2",
  "tzdata>=2024.1",
  "pillow>=11,<13",
  "psutil>=6,<8",
]

[project.optional-dependencies]
local-embedding = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
buwubot = "buwubot.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/buwubot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
