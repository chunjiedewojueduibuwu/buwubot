    <p class="local-note">本机管理 · 127.0.0.1</p>

  <dialog id="editor"><form id="edit-form"><div class="dialog-heading"><h2 id="edit-title"></h2><button type="button" id="close-editor" class="text-button" aria-label="关闭编辑窗口">×</button></div><div id="edit-fields"></div><div class="form-actions"><button type="button" id="cancel-editor">取消</button><button class="primary" type="submit">保存修改</button></div><p id="edit-error" role="alert"></p></form></dialog>
